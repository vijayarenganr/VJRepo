name: Run Python Program on Push

on:
  push:
    branches:
      - main  # Change this to your desired branch if needed

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Fetches your repository code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Use the version you need

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f inv-report-req.txt ]; then pip install -r inv-report-req.txt; fi

      - name: Run Python script
        run: python python/helloworld.py  # Change 'script.py' to your actual script name
